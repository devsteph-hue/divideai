<title>Divide Aí</title>
<style>
:root{
  --base:#14110F; --surf:#1F1A17; --surf2:#2A2320; --line:#3A302A;
  --ink:#F4EFE8; --ink-dim:#A99C90; --ink-faint:#6E635B;
  --amber:#E8912D; --amber-dark:#B96F1D;
  --pago:#6FA86B; --alerta:#D8604A;
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--base);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  padding-bottom:120px;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* cabeçalho */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--base);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:12px 14px;
}
header h1{margin:0;font-size:17px;font-weight:650;flex:1;letter-spacing:-.01em}
header .sub{display:block;font-size:12px;font-weight:450;color:var(--ink-dim);letter-spacing:0}
.voltar{width:38px;height:38px;border-radius:10px;background:var(--surf);
  display:grid;place-items:center;font-size:20px;flex:none}
.hbtn{padding:8px 12px;border-radius:10px;background:var(--surf);font-size:14px;font-weight:550;flex:none}

main{padding:14px}
.vazio{text-align:center;padding:48px 24px;color:var(--ink-dim)}
.vazio strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-weight:600}

/* mesas */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.mesa{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.mesa .n{font-size:26px;font-weight:700;letter-spacing:-.03em}
.mesa .v{font-size:18px;font-weight:650;color:var(--amber)}
.mesa .l{font-size:11px;color:var(--ink-faint);margin-top:2px}
.mesa.quitada{border-color:var(--pago)}
.mesa.quitada .v{color:var(--pago)}
.mesa.nova{border-style:dashed;border-color:var(--amber-dark);color:var(--amber);
  align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:15px}

/* linhas de item */
.item{display:flex;align-items:stretch;gap:0;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.item.sel{border-color:var(--amber);background:#241C14}
.item.zerado{opacity:.4}
.check{width:56px;flex:none;display:grid;place-items:center;border-right:1px solid var(--line)}
.box{width:26px;height:26px;border-radius:7px;border:2px solid var(--ink-faint);display:grid;place-items:center}
.item.sel .box{background:var(--amber);border-color:var(--amber)}
.item.sel .box::after{content:"";width:11px;height:6px;border-left:2.5px solid #14110F;
  border-bottom:2.5px solid #14110F;transform:rotate(-45deg) translate(1px,-2px)}
.corpo{flex:1;padding:11px 12px;min-width:0}
.corpo .nome{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.corpo .meta{font-size:12.5px;color:var(--ink-dim);margin-top:2px}
.valor{padding:11px 12px;display:flex;flex-direction:column;justify-content:center;
  align-items:flex-end;text-align:right;flex:none}
.valor .v{font-weight:650;font-size:15px}
.valor .frac{font-size:11px;color:var(--amber);margin-top:2px;font-weight:600}
.dividir{padding:0 14px;background:var(--surf2);border-left:1px solid var(--line);
  font-size:11px;font-weight:650;color:var(--amber);flex:none;letter-spacing:.01em}

/* barra inferior */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surf);
  border-top:1px solid var(--line);padding:12px 14px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.linha-resumo{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-dim);margin-bottom:3px}
.linha-resumo b{color:var(--ink);font-weight:600}
.total-linha{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.total-linha span{font-size:13px;color:var(--ink-dim)}
.total-linha b{font-size:27px;font-weight:700;letter-spacing:-.03em}
.acao{width:100%;padding:16px;border-radius:12px;background:var(--amber);color:#14110F;
  font-size:17px;font-weight:700;letter-spacing:-.01em}
.acao:disabled{background:var(--surf2);color:var(--ink-faint)}
.acao.sec{background:var(--surf2);color:var(--ink);font-weight:600;font-size:15px;padding:13px}

/* modal */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;
  align-items:flex-end;justify-content:center}
.modal{background:var(--surf);width:100%;max-width:520px;border-radius:20px 20px 0 0;
  padding:20px 18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow-y:auto;animation:sobe .18s ease-out}
@keyframes sobe{from{transform:translateY(14px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal h2{margin:0 0 4px;font-size:19px;font-weight:650;letter-spacing:-.01em}
.modal p.dica{margin:0 0 16px;color:var(--ink-dim);font-size:13.5px}
.campo{width:100%;padding:14px;border-radius:11px;background:var(--surf2);
  border:1px solid var(--line);color:var(--ink);font-size:17px;margin-bottom:10px;font-weight:550}
.campo:focus{outline:2px solid var(--amber);outline-offset:1px}
label.rot{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:5px;font-weight:550}

/* divisor */
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:14px 0}
.stepper button{width:56px;height:56px;border-radius:14px;background:var(--surf2);
  font-size:26px;font-weight:600;display:grid;place-items:center}
.stepper .n{font-size:40px;font-weight:700;min-width:64px;text-align:center}
.previa{background:var(--surf2);border-radius:12px;padding:14px;margin:14px 0;text-align:center}

<body>
<header>
  <button class="voltar" id="btnVoltar" hidden>‹</button>
  <h1 id="titulo">Divide Aí<span class="sub" id="subtitulo">Contas de mesa sem calculadora</span></h1>
  <button class="hbtn" id="btnHeader" hidden></button>
</header>
<main id="tela"></main>
<div id="barra"></div>
<div id="modal"></div>

<script>
/* ==========================================================================
   NÚCLEO DE CÁLCULO
   Regras: dinheiro só em centavos inteiros; quantidade consumida em fração
   exata; arredondamento do ACUMULADO, nunca da parcela isolada.
   ========================================================================== */
const mdc=(a,b)=>b===0?Math.abs(a):mdc(b,a%b);
function fr(n,d=1){if(d===0)throw Error('den 0');if(d<0){n=-n;d=-d}
  const g=mdc(Math.abs(n),d)||1;return{n:n/g,d:d/g}}
const frSoma=(a,b)=>fr(a.n*b.d+b.n*a.d,a.d*b.d);
const frSub=(a,b)=>fr(a.n*b.d-b.n*a.d,a.d*b.d);
const frMult=(a,b)=>fr(a.n*b.n,a.d*b.d);
const frZero=a=>a.n===0, frNeg=a=>a.n<0, frMaior=(a,b)=>a.n*b.d>b.n*a.d;
const frTxt=a=>a.d===1?`${a.n}`:`${a.n}/${a.d}`;
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

const totalMesa=m=>m.itens.reduce((s,i)=>s+i.quantidade*i.precoUnitario,0);
const jaCobrado=m=>m.rodadas.reduce((s,r)=>s+r.subtotal,0);
const saldoMesa=m=>totalMesa(m)-jaCobrado(m);
const mesaQuitada=m=>m.itens.length>0&&m.itens.every(i=>frZero(i.saldo));

function calcularRodada(mesa,selecoes,{cobrarServico=true}={}){
  const linhas=[];let eN=0,eD=1;
  for(const sel of selecoes){
    const item=mesa.itens.find(i=>i.id===sel.itemId);
    if(!item)throw Error('Item não existe');
    const u=sel.unidades;
    if(frNeg(u)||frZero(u))throw Error(`Quantidade inválida em ${item.nome}`);
    if(frMaior(u,item.saldo))
      throw Error(`${item.nome} tem só ${frTxt(item.saldo)} em aberto`);
    const ve=frMult(u,fr(item.precoUnitario));
    eN=eN*ve.d+ve.n*eD; eD=eD*ve.d;
    linhas.push({itemId:item.id,nome:item.nome,unidades:u,
      rotulo:u.d===1?`${u.n}x ${item.nome}`:`${item.nome} (${u.n}/${u.d})`,
      valorExato:ve,valor:Math.round(ve.n/ve.d)});
  }
  const exato=fr(eN,eD);
  // arredonda o acumulado e desconta o que já saiu: o erro nunca soma
  const acum=frSoma(mesa.exatoCobrado,exato);
  const subtotal=Math.round(acum.n/acum.d)-jaCobrado(mesa);
  ajustarSobra(linhas,subtotal);
  const servico=cobrarServico?Math.round(subtotal*mesa.taxaServicoPct/100):0;
  const ehUltima=mesa.itens.every(item=>{
    const ped=selecoes.filter(s=>s.itemId===item.id)
      .reduce((a,s)=>frSoma(a,s.unidades),fr(0));
    return frZero(frSub(item.saldo,ped));
  });
  return{linhas,subtotal,servico,total:subtotal+servico,ehUltima,exato};
}
function ajustarSobra(linhas,subtotal){
  const soma=linhas.reduce((s,l)=>s+l.valor,0);let diff=subtotal-soma;
  if(diff===0||!linhas.length)return;
  const passo=diff>0?1:-1;
  const ord=[...linhas].sort((a,b)=>
    (b.valorExato.n/b.valorExato.d)%1-(a.valorExato.n/a.valorExato.d)%1);
  let i=0;while(diff!==0){ord[i%ord.length].valor+=passo;diff-=passo;i++}
}
function confirmarRodada(mesa,rodada,pagamento){
  for(const l of rodada.linhas){
    const it=mesa.itens.find(i=>i.id===l.itemId);
    it.saldo=frSub(it.saldo,l.unidades);
    if(frNeg(it.saldo))throw Error('Saldo negativo');
  }
  mesa.exatoCobrado=frSoma(mesa.exatoCobrado,rodada.exato);
  mesa.rodadas.push({id:'r'+(mesa.rodadas.length+1),em:Date.now(),...rodada,pagamento});
  if(mesaQuitada(mesa))mesa.status='fechada';
}
function estornarRodada(mesa,rid){
  const i=mesa.rodadas.findIndex(r=>r.id===rid);if(i<0)return;
  const r=mesa.rodadas[i];
  for(const l of r.linhas){
    const it=mesa.itens.find(x=>x.id===l.itemId);
    it.saldo=frSoma(it.saldo,l.unidades);
  }
  mesa.exatoCobrado=frSub(mesa.exatoCobrado,r.exato);
  mesa.rodadas.splice(i,1);mesa.status='aberta';
}

/* ==========================================================================
   LICENÇA
   O código do aparelho é gerado uma vez e fica salvo. A chave de ativação é
   derivada dele: só vale naquele aparelho. Validação é feita aqui mesmo,
   sem servidor e sem internet.
   ========================================================================== */
const SEGREDO='DvA!2026#comanda@br';
function codigoAparelho(){
  let c=null;try{c=localStorage.getItem('divideai_ap')}catch(e){}
  if(!c){
    c='';const alf='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for(let i=0;i<6;i++)c+=alf[Math.floor(Math.random()*alf.length)];
    try{localStorage.setItem('divideai_ap',c)}catch(e){}
  }
  return c;
}
/**
 * A chave depende do aparelho E do período de validade.
 * periodo 'V'      = vitalícia, nunca expira
 * periodo '2026-11' = vale até o último dia de novembro de 2026
 */
function chaveDe(cod,periodo='V'){
  const bloco=salt=>{
    let h=2166136261>>>0;const t=salt+String(cod).toUpperCase()+'|'+periodo+'|'+SEGREDO;
    for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
    return (h%1679616).toString(36).toUpperCase().padStart(4,'0');
  };
  return [bloco('A'),bloco('B'),bloco('C')].join('-');
}
const AP=codigoAparelho();
const limpaChave=k=>String(k).toUpperCase().replace(/[^A-Z0-9]/g,'');

/** Descobre a que período uma chave pertence, testando os próximos 24 meses. */
function periodoDaChave(chave){
  const k=limpaChave(chave);
  if(k===limpaChave(chaveDe(AP,'V')))return 'V';
  const h=new Date();
  for(let i=-1;i<24;i++){
    const d=new Date(h.getFullYear(),h.getMonth()+i,1);
    const p=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(k===limpaChave(chaveDe(AP,p)))return p;
  }
  return null;
}
const fimDoPeriodo=p=>{
  if(p==='V')return null;
  const [a,m]=p.split('-').map(Number);
  return new Date(a,m,0,23,59,59);           // último dia do mês
};
function licenca(){
  try{
    const k=localStorage.getItem('divideai_lic');
    const p=localStorage.getItem('divideai_per');
    if(!k||!p)return null;
    if(limpaChave(k)!==limpaChave(chaveDe(AP,p)))return null;
    const fim=fimDoPeriodo(p);
    return {periodo:p,fim,vencida:!!fim&&Date.now()>fim.getTime()};
  }catch(e){return null}
}
const ativado=()=>{const l=licenca();return !!l&&!l.vencida};
const diasRestantes=()=>{
  const l=licenca();if(!l||!l.fim)return null;
  return Math.ceil((l.fim.getTime()-Date.now())/86400000);
};
function ativar(chave){
  const p=periodoDaChave(chave);
  if(!p)return false;
  const fim=fimDoPeriodo(p);
  if(fim&&Date.now()>fim.getTime())return 'vencida';
  try{
    localStorage.setItem('divideai_lic',chaveDe(AP,p));
    localStorage.setItem('divideai_per',p);
  }catch(e){}
  return true;
}

/* ==========================================================================
   ESTADO
   ========================================================================== */
const CARDAPIO_INICIAL=[
  {id:'c1',nome:'Chopp 300ml',preco:1200,comp:true},
  {id:'c2',nome:'Cerveja 600ml',preco:3500,comp:true},
  {id:'c3',nome:'Refrigerante',preco:800,comp:false},
  {id:'c4',nome:'Suco natural',preco:1200,comp:false},
  {id:'c5',nome:'Água',preco:600,comp:false},
  {id:'c6',nome:'Caipirinha',preco:2200,comp:false},
  {id:'c7',nome:'Porção de fritas',preco:4200,comp:true},
  {id:'c8',nome:'Porção de calabresa',preco:4800,comp:true},
  {id:'c9',nome:'Isca de frango',preco:5500,comp:true},
  {id:'c10',nome:'Picanha na chapa',preco:8990,comp:true},
  {id:'c11',nome:'Prato executivo',preco:3800,comp:false},
  {id:'c12',nome:'Sobremesa',preco:1800,comp:false},
];
let S={mesas:[],cardapio:CARDAPIO_INICIAL,seq:1};
let vista={tela:'mesas',mesaId:null,sel:{},servico:true,aba:'conta'};

function salvar(){try{localStorage.setItem('divideai',JSON.stringify(S))}catch(e){}}
function carregar(){
  try{
    const b=localStorage.getItem('divideai');
    if(b){const d=JSON.parse(b);if(d&&d.mesas)S=d}
  }catch(e){}
}
const mesaAtual=()=>{
  const m=S.mesas.find(m=>m.id===vista.mesaId);
  if(m&&!m.pessoas)m.pessoas=[];   // mesas criadas antes das comandas
  return m;
};

function novaMesa(numero){
  const m={id:'m'+(S.seq++),numero,abertaEm:Date.now(),itens:[],pessoas:[],
    taxaServicoPct:10,rodadas:[],status:'aberta',exatoCobrado:fr(0)};
  S.mesas.push(m);salvar();return m;
}
function lancarItem(mesa,prod,qtd,donoId){
  // junta com lançamento igual SÓ se for da mesma comanda
  const ex=mesa.itens.find(i=>i.produtoId===prod.id&&i.donoId===donoId&&i.saldo.d===1);
  if(ex){ex.quantidade+=qtd;ex.saldo=frSoma(ex.saldo,fr(qtd))}
  else mesa.itens.push({id:'i'+Date.now()+Math.random().toString(36).slice(2,5),
    produtoId:prod.id,nome:prod.nome,quantidade:qtd,precoUnitario:prod.preco,
    compartilhavel:prod.comp,saldo:fr(qtd),donoId:donoId||null,em:Date.now()});
  salvar();
}
function novaPessoa(mesa,nome){
  const p={id:'p'+Date.now()+Math.random().toString(36).slice(2,4),
    nome:nome||('Comanda '+(mesa.pessoas.length+1))};
  mesa.pessoas.push(p);salvar();return p;
}
const nomeDono=(mesa,id)=>id?(mesa.pessoas.find(p=>p.id===id)?.nome||'?'):'Mesa';
const itensDe=(mesa,filtro)=>filtro==='todos'?mesa.itens
  :mesa.itens.filter(i=>(i.donoId||'mesa')===filtro);
const saldoDe=(mesa,filtro)=>itensDe(mesa,filtro).reduce((s,i)=>{
  const v=frMult(i.saldo,fr(i.precoUnitario));return s+Math.round(v.n/v.d)},0);

/* ==========================================================================
   INTERFACE
   ========================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){
  const d=document.createElement('div');d.className='toast';d.textContent=t;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2000);
}

function render(){
  const m=mesaAtual();
  $('btnVoltar').hidden=vista.tela==='mesas';
  $('btnHeader').hidden=true;
  if(vista.tela==='mesas'){
    $('titulo').innerHTML='Divide Aí<span class="sub">Contas de mesa sem calculadora</span>';
    $('btnHeader').hidden=false;$('btnHeader').textContent='Cardápio';
    $('btnHeader').onclick=()=>{vista.tela='cardapio';render()};
    telaMesas();
    const lic=licenca(), dias=diasRestantes();
    if(!ativado()){
      $('tela').insertAdjacentHTML('afterbegin',
        lic&&lic.vencida
          ? `<button class="faixa venc" onclick="telaAtivar()">
              <b>Acesso vencido</b> · suas mesas estão salvas. Renovar →</button>`
          : `<button class="faixa" onclick="telaAtivar()">
              <b>Modo demonstração</b> · uma mesa por vez. Ativar por ${PRECO} →</button>`);
    } else if(dias!==null&&dias<=7){
      $('tela').insertAdjacentHTML('afterbegin',
        `<button class="faixa" onclick="telaAtivar()">
          <b>${dias<=1?'Vence hoje':'Vence em '+dias+' dias'}</b> · renovar →</button>`);
    }
    $('tela').insertAdjacentHTML('beforeend',
      `<button class="atalho" onclick="vista.tela='cardapio';render()">
         <span><b>Cardápio</b><em>${S.cardapio.length} ${
           S.cardapio.length===1?'item':'itens'} · cadastrar por foto ou na mão</em></span>
         <i>›</i></button>
       <button class="ajuda" onclick="telaAjuda()">Como usar o app</button>`);
  } else if(vista.tela==='cardapio'){
    $('titulo').innerHTML='Cardápio<span class="sub">Itens e preços</span>';
    telaCardapio();
  } else if(m){
    const s=saldoMesa(m);
    $('titulo').innerHTML=`Mesa ${esc(m.numero)}<span class="sub">${
      s>0?`faltam ${brl(s)}`:'conta quitada'}</span>`;
    $('btnHeader').hidden=false;$('btnHeader').textContent='Cardápio';
    $('btnHeader').onclick=()=>{vista.tela='cardapio';render()};
    telaMesa(m);
  }
}
$('btnVoltar').onclick=()=>{
  if(vista.tela==='cardapio'){
    vista.tela=vista.mesaId?'mesa':'mesas';render();return;
  }
  if(vista.tela==='mesa'&&Object.keys(vista.sel).length){vista.sel={};render();return}
  vista.tela='mesas';vista.mesaId=null;vista.sel={};render();
};

/* --- mesas --- */
function telaMesas(){
  const abertas=S.mesas.filter(m=>m.status==='aberta');
  $('tela').innerHTML=`<div class="mesas">
    <button class="mesa nova" onclick="abrirMesa()">+ Abrir mesa</button>
    ${abertas.map(m=>{
      const s=saldoMesa(m),t=totalMesa(m);
      return `<button class="mesa${s===0&&t>0?' quitada':''}" onclick="verMesa('${m.id}')">
        <div><div class="n">${esc(m.numero)}</div>
        <div class="l">${m.itens.length} ${m.itens.length===1?'item':'itens'}${
          m.pessoas?.length?` · ${m.pessoas.length} comanda${m.pessoas.length>1?'s':''}`:''}${
          m.rodadas.length?` · ${m.rodadas.length} pago${m.rodadas.length>1?'s':''}`:''}</div></div>

      ${zerado?'':`<button class="dividir" onclick="abrirDivisao('${it.id}')">dividir</button>`}

let lidos=[];
window.importarFoto=()=>{

function carregarOCR(){
  return new Promise((ok,erro)=>{
    if(window.Tesseract)return ok();
    const t=document.createElement('script');
    t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    t.onload=()=>ok();t.onerror=()=>erro(new Error('sem conexão'));
    document.head.appendChild(t);
  });
}
/** Procura linhas no formato "nome .... 35,00" */
function extrairItens(texto){
  const fora=/^(cardápio|cardapio|menu|bebidas|porções|porcoes|pratos|sobremesas|drinks|entradas|total)$/i;
  const achados=[];
  texto.split(/\n+/).forEach(linha=>{
    const l=linha.replace(/\s+/g,' ').trim();
    if(l.length<4||fora.test(l))return;
    const m=l.match(/^(.{3,60}?)[\s.\-–—•:]*R?\$?\s*(\d{1,4})[.,](\d{2})\s*$/);
    if(!m)return;
    const nome=m[1].replace(/[.\-–—•:]+$/,'').trim();
    const preco=parseInt(m[2],10)*100+parseInt(m[3],10);
    if(nome.length<3||preco<=0||preco>5000000)return;
    if(!/[a-zA-ZÀ-ú]{3}/.test(nome))return;
    achados.push({nome,preco,usar:true});
  });
  return achados;
}
window.lerFotos=async files=>{
  if(!files||!files.length)return;
  const arr=[...files];
  modal(`<h2>Lendo</h2><p class="dica" id="statusOcr">Preparando…</p>
    <div class="barrinha"><i id="prog" style="width:4%"></i></div>
    <p class="dica" style="margin-top:14px">Na primeira vez ele baixa o leitor, o que demora
      um pouco. Das próximas é mais rápido. Não feche a tela.</p>`);
  try{ await carregarOCR(); }
  catch(e){
    modal(`<h2>Sem conexão</h2><p class="dica">A leitura por foto precisa de internet na
      primeira vez, para baixar o leitor. Conecte e tente de novo — ou cadastre na mão.</p>
      <button class="acao" onclick="fecharModal()">Entendi</button>`);
    return;
  }
  lidos=[];
  try{
    const worker=await Tesseract.createWorker('por');
    for(let i=0;i<arr.length;i++){
      $('statusOcr').textContent=`Foto ${i+1} de ${arr.length}…`;
      const r=await worker.recognize(arr[i]);
      lidos=lidos.concat(extrairItens(r.data.text||''));
      $('prog').style.width=Math.round((i+1)/arr.length*100)+'%';
    }
    await worker.terminate();
  }catch(e){
    modal(`<h2>Não consegui ler</h2><p class="dica">${esc(String(e.message||e))}</p>
      <button class="acao" onclick="fecharModal()">Fechar</button>`);
    return;
  }
  // tira repetidos
  const vistos=new Set();
  lidos=lidos.filter(x=>{const k=x.nome.toLowerCase();
    if(vistos.has(k))return false;vistos.add(k);return true});
  revisarLidos();
};
function revisarLidos(){
  if(!lidos.length){
    modal(`<h2>Não achei preços</h2>
      <p class="dica">Ele procura linhas com nome e preço, tipo “Cerveja 600ml 35,00”.
        Tente uma foto mais reta, mais perto, ou com uma coluna por vez.</p>
      <button class="acao" onclick="importarFoto()">Tentar outra foto</button>
      <button class="acao sec" style="margin-top:8px" onclick="fecharModal()">Cadastrar na mão</button>`);
    return;
  }
  const n=lidos.filter(x=>x.usar).length;
  modal(`<h2>Confira antes de cadastrar</h2>
    <p class="dica">Ele leu ${lidos.length} ${lidos.length===1?'item':'itens'}.
      Desmarque o que não presta e corrija o que saiu torto.</p>
    <div class="lidos">${lidos.map((x,i)=>`
      <div class="lido${x.usar?'':' off'}">
        <button class="bx" onclick="alternarLido(${i})"></button>
        <input class="campo nome" value="${esc(x.nome)}"
          oninput="lidos[${i}].nome=this.value">
        <input class="campo preco" inputmode="decimal" value="${(x.preco/100).toFixed(2).replace('.',',')}"
          oninput="mudarPrecoLido(${i},this.value)">
      </div>`).join('')}</div>
    <button class="acao" onclick="confirmarImportacao()">Cadastrar ${n} ${n===1?'item':'itens'}</button>
    <button class="acao sec" style="margin-top:8px" onclick="importarFoto()">Ler outra foto</button>`);
}
window.alternarLido=i=>{lidos[i].usar=!lidos[i].usar;revisarLidos()};
window.mudarPrecoLido=(i,v)=>{
  const p=Math.round(parseFloat(String(v).replace(/\./g,'').replace(',','.'))*100);
  if(Number.isFinite(p))lidos[i].preco=p;
};
window.confirmarImportacao=()=>{
  let n=0;
  lidos.filter(x=>x.usar&&x.nome.trim()&&x.preco>0).forEach(x=>{
    S.cardapio.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,5),
      nome:x.nome.trim(),preco:x.preco,comp:true});n++;
  });
  salvar();lidos=[];fecharModal();render();
  toast(n+(n===1?' item cadastrado':' itens cadastrados'));
};

window.editarProduto=pid=>{
  const p=pid?S.cardapio.find(x=>x.id===pid):null;
  modal(`<h2>${p?'Editar produto':'Novo produto'}</h2>
    <label class="rot" for="pn">Nome</label>
    <input class="campo" id="pn" value="${p?esc(p.nome):''}" autocomplete="off">
    <label class="rot" for="pp">Preço</label>
    <input class="campo" id="pp" inputmode="decimal" placeholder="35,00"
      value="${p?(p.preco/100).toFixed(2).replace('.',','):''}">
    <button class="acao" onclick="salvarProduto(${p?`'${p.id}'`:'null'})">Salvar</button>
    ${p?`<button class="acao sec" style="margin-top:8px;color:var(--alerta)"
      onclick="removerProduto('${p.id}')">Remover do cardápio</button>`:''}`);
};
window.salvarProduto=pid=>{
  const nome=$('pn').value.trim();
  const preco=Math.round(parseFloat($('pp').value.replace(/\./g,'').replace(',','.'))*100);
  if(!nome||!Number.isFinite(preco)||preco<=0){toast('Preencha nome e preço');return}
  if(pid){const p=S.cardapio.find(x=>x.id===pid);p.nome=nome;p.preco=preco}
  else S.cardapio.push({id:'c'+Date.now(),nome,preco,comp:true});
  salvar();fecharModal();render();
};
window.removerProduto=pid=>{
  S.cardapio=S.cardapio.filter(p=>p.id!==pid);salvar();fecharModal();render();
};

/* --- modal --- */
function modal(html){
  $('modal').innerHTML=`<div class="fundo" onclick="if(event.target===this)fecharModal()">
    <div class="modal">${html}</div></div>`;
}
window.fecharModal=()=>{$('modal').innerHTML=''};

   PRIMEIRA ABERTURA E ATIVAÇÃO
